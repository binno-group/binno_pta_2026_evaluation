# Production nginx: TLS on :443, and :80 reduced to the two jobs it still has,
# answering the ACME challenge and sending everyone to HTTPS.

upstream binno_api {
    # See conf.d/binno.conf for why resolution is static and the keepalive pool
    # matters.
    server binno:8080 max_fails=3 fail_timeout=5s;

    keepalive 64;
}

log_format binno '$remote_addr $request_method $uri -> $status '
                 'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

# ---------------------------------------------------------------------------
# :80, ACME challenge and redirect only.
server {
    listen 80;
    server_name api.binno.uz;

    access_log /var/log/nginx/access.log binno;

    # Let's Encrypt writes its proof here and fetches it over plain HTTP. This
    # location must stay reachable on :80 forever, not just at issuance, renewal
    # repeats the same exchange every 60 days.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# :443, the real service.
server {
    listen 443 ssl;
    # nginx 1.25.1+ syntax.
    http2 on;
    server_name api.binno.uz;

    access_log /var/log/nginx/access.log binno;

    ssl_certificate     /etc/letsencrypt/live/api.binno.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.binno.uz/privkey.pem;

    # Mozilla "intermediate": TLS 1.2 and 1.3, forward secrecy only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    # Off, not on: with TLS 1.3 the client's preference order is the informed
    # one, and forcing the server's is how a slow AES path gets picked for a
    # phone that would rather use ChaCha20.
    ssl_prefer_server_ciphers off;

    # Session resumption.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # Tickets off: nginx rotates ticket keys only on reload, so a long-lived
    # process ends up encrypting many sessions under one key and forward secrecy
    # weakens.
    ssl_session_tickets off;

    # Lets a client verify revocation without contacting the CA itself, which
    # removes a third-party round trip from the first connection.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/api.binno.uz/chain.pem;
    resolver 127.0.0.11 valid=300s;
    resolver_timeout 5s;

    # HSTS. START SHORT, 300s, AND RAISE IT ONLY AFTER VERIFYING HTTPS WORKS.
    add_header Strict-Transport-Security "max-age=300" always;

    include /etc/nginx/proxy-backend.conf;

    # Same reasoning as development: the fleet's metrics are not the public's.
    location = /metrics {
        return 404;
    }

    # /docs carries no authentication and never has, the handler is mounted
    # above the /api/v1 subtree that rate limiting, admission control and bearer
    # identity all hang off, so it answers anyone who asks.
    location ^~ /docs {
        return 404;
    }

    # The container healthcheck's own endpoint.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        # Timeouts and the upstream-retry policy come from proxy-backend.conf,
        # included above, so :443 here and :80 in development cannot drift apart.
        proxy_pass http://binno_api;
    }
}
