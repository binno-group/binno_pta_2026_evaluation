# Faza 0 of the horizontal-scaling boundary: one proxy in front of N identical
# API replicas.

upstream binno_api {
    # The compose service name resolves to one A record per replica and nginx
    # adds every returned address to the round-robin group.
    server binno:8080 max_fails=3 fail_timeout=5s;

    keepalive 64;
}

log_format binno '$remote_addr $request_method $uri -> $status '
                 'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log binno;

    include /etc/nginx/proxy-backend.conf;

    # /metrics is unauthenticated and describes the fleet: request rates, pool
    # saturation, outbox backlog.
    location = /metrics {
        return 404;
    }

    # /docs serves Swagger UI and the complete OpenAPI document: every route,
    # every field name, the operator queue endpoints, the request bodies that
    # drive them.
    location ^~ /docs {
        return 404;
    }

    # The container healthcheck's own endpoint, answered by nginx itself.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        # Timeouts and the upstream-retry policy come from proxy-backend.conf,
        # included above, so :80 here and :443 in production cannot drift apart.
        proxy_pass http://binno_api;
    }
}
