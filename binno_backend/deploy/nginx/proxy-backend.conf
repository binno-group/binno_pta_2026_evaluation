# Shared upstream-proxying rules, included by every server block that fronts the
# API, :80 in development and :443 in production.

# Connecting is not waiting for an answer, and the two need very different
# budgets. A healthy replica on the compose network completes a TCP handshake in
# well under a millisecond; the only thing 2s ever bought was a long stall in
# front of a replica that had already gone away.
#
# It has to stay comfortably below proxy_next_upstream_timeout. When the two are
# equal the first attempt spends the entire retry budget before failing, so the
# retry configured below never happens and the caller gets a 504 -- measured at
# 103 of them, all landing at exactly ~2000ms, during a rolling deploy at 50 RPS.
#
# 1s, not something tighter: above the admission limit connections wait in the
# accept backlog, and that wait is legitimate queueing rather than a dead
# upstream. Cutting it at 250ms turned a saturated replica into a 502 storm
# (19 244 of them at 10 000 RPS) instead of letting the application answer with
# the 503 it was ready to give.
proxy_connect_timeout 1s;

# These two outlast the application's own request budget rather than racing it:
# a response the app is still writing must not be cut off by the proxy.
proxy_send_timeout 5s;
proxy_read_timeout 5s;

# Required for the upstream keepalive pool: nginx must speak HTTP/1.1 and must
# not forward the client's Connection header to the upstream.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
# $scheme is the point of this file existing in two places: on :443 it reports
# https, which is what tells the application its client is on TLS.
proxy_set_header X-Forwarded-Proto $scheme;
# Appends the peer nginx actually saw.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# Retry the next upstream, for IDEMPOTENT METHODS ONLY. `non_idempotent` must
# never appear in this list: it would replay POSTs whose first attempt may have
# already committed.
#
# Defined here rather than per-location so a location added later inherits the
# policy instead of silently falling back to the nginx default. The budget is
# what makes the retry real -- see proxy_connect_timeout above.
proxy_next_upstream error timeout http_502 http_504;
# 3, not 2: with two replicas a single retry can land on the same peer that
# just failed, and a rolling deploy is exactly when that matters. The third try
# costs nothing when nothing is wrong.
proxy_next_upstream_tries 3;
# Room for a failed connect plus a real second attempt. Equal to
# proxy_connect_timeout it would be no budget at all.
proxy_next_upstream_timeout 3s;
