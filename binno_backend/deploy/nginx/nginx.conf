# Main-context nginx configuration.

user nginx;
worker_processes auto;

# Each connection costs a file descriptor, and a proxied request holds two: one
# to the client, one to the upstream.
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # 8192 per worker x 8 workers = 65 536 concurrent connections, against a
    # service that begins shedding at ~500 RPS and whose graceful-degradation
    # ceiling was measured at 5000-7000.
    worker_connections 8192;

    # Accept as many new connections as are pending per wakeup rather than one
    # at a time.
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not disclose the nginx version in Server: or on error pages.
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # Longer than the application's 2s request budget so a keepalive connection
    # is not recycled mid-request, short enough that idle clients release slots
    # back to the pool the events block above is sizing.
    keepalive_timeout  65s;
    keepalive_requests 1000;

    # Bound how long a slow client may hold a worker connection.
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;
    client_max_body_size  1m;

    include /etc/nginx/conf.d/*.conf;
}
