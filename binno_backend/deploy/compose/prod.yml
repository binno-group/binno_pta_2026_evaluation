services:
  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes: !override
      - ./deploy/nginx/conf.d-tls:/etc/nginx/conf.d:ro
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/proxy-backend.conf:/etc/nginx/proxy-backend.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    command: >-
      sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot:v5.7.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >-
      sh -c 'trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done'

  binno:
    restart: unless-stopped
    environment:
      ENV: production
      SMS_PROVIDER: "${SMS_PROVIDER:?set SMS_PROVIDER in .env (eskiz or playmobile; log is development-only)}"
      SEARCH_CACHE_TTL: "${SEARCH_CACHE_TTL:-60s}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      OLTP_DATABASE_URL: >-
        postgres://binno:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres-oltp:5432/binno?sslmode=disable
      ANALYTICS_DATABASE_URL: >-
        postgres://binno:${POSTGRES_PASSWORD}@postgres-analytics:5432/binno_analytics?sslmode=disable

  dispatcher:
    ports: !override
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      OLTP_DATABASE_URL: >-
        postgres://binno:${POSTGRES_PASSWORD}@postgres-oltp:5432/binno?sslmode=disable
      ANALYTICS_DATABASE_URL: >-
        postgres://binno:${POSTGRES_PASSWORD}@postgres-analytics:5432/binno_analytics?sslmode=disable

  postgres-oltp:
    ports: !override
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"

  postgres-analytics:
    ports: !override
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"

  redis:
    ports: !override
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --save 900 1
      --appendonly no

  prometheus:
    ports: !override
      - "127.0.0.1:9091:9090"
    restart: unless-stopped

  grafana:
    ports: !override
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"

  loki:
    ports: !override
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  tempo:
    ports: !override
      - "127.0.0.1:4317:4317"
    restart: unless-stopped

volumes:
  letsencrypt:
  certbot-webroot:
