x-vm-a: &vm-a "0-3"

services:
  nginx:
    cpuset: *vm-a
    mem_limit: 128m

  binno:
    cpuset: *vm-a
    mem_limit: 1g
    environment:
      GOMEMLIMIT: 768MiB

  dispatcher:
    cpuset: *vm-a
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 192MiB

  postgres-oltp:
    cpuset: *vm-a
    mem_limit: 2g
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=100
      - -c
      - effective_cache_size=1536MB

  postgres-analytics:
    cpuset: *vm-a
    mem_limit: 1g

  clickhouse:
    cpuset: *vm-a
    mem_limit: 2g

  redis:
    cpuset: *vm-a
    mem_limit: 512m
    command:
      - redis-server
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction

  prometheus:
    cpuset: *vm-a
    mem_limit: 512m

  grafana:
    cpuset: *vm-a
    mem_limit: 384m

  loki:
    cpuset: *vm-a
    mem_limit: 512m

  tempo:
    cpuset: *vm-a
    mem_limit: 512m
