x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-hardening: &hardened
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  nginx:
    image: nginx:1.27-alpine
    logging: *default-logging
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --timeout=2 http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/proxy-backend.conf:/etc/nginx/proxy-backend.conf:ro
    depends_on:
      binno:
        condition: service_started

  binno:
    <<: *hardened
    logging: *default-logging
    build:
      context: .
      args:
        TARGET: binno
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    expose:
      - "8080"
    env_file: .env
    environment:
      OLTP_DATABASE_URL: postgres://binno:binno@postgres-oltp:5432/binno?sslmode=disable
      ANALYTICS_DATABASE_URL: postgres://binno:binno@postgres-analytics:5432/binno_analytics?sslmode=disable
      REDIS_ADDR: redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      postgres-oltp:
        condition: service_healthy
      redis:
        condition: service_healthy

  dispatcher:
    <<: *hardened
    logging: *default-logging
    build:
      context: .
      args:
        TARGET: dispatcher
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    env_file: .env
    environment:
      OLTP_DATABASE_URL: postgres://binno:binno@postgres-oltp:5432/binno?sslmode=disable
      ANALYTICS_DATABASE_URL: postgres://binno:binno@postgres-analytics:5432/binno_analytics?sslmode=disable
      REDIS_ADDR: redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      postgres-oltp:
        condition: service_healthy
      postgres-analytics:
        condition: service_healthy

  postgres-oltp:
    logging: *default-logging
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: binno
      POSTGRES_USER: binno
      POSTGRES_PASSWORD: binno
    ports:
      - "5432:5432"
    volumes:
      - postgres-oltp-data:/var/lib/postgresql/data
      - ./deploy/postgres/10-replication-hba.sh:/docker-entrypoint-initdb.d/10-replication-hba.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U binno -d binno -tAc 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres-analytics:
    logging: *default-logging
    image: postgres:16.4
    environment:
      POSTGRES_DB: binno_analytics
      POSTGRES_USER: binno
      POSTGRES_PASSWORD: binno
    ports:
      - "5433:5432"
    volumes:
      - postgres-analytics-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binno -d binno_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-oltp-replica:
    image: postgis/postgis:16-3.4
    profiles: [replica]
    logging: *default-logging
    environment:
      PGPASSWORD: binno
      PGUSER: binno
    ports:
      - "5434:5432"
    volumes:
      - postgres-oltp-replica-data:/var/lib/postgresql/data
    depends_on:
      postgres-oltp:
        condition: service_healthy
    user: postgres
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          echo "replica: cloning from primary via pg_basebackup"
          rm -rf "$$PGDATA"/*
          until pg_basebackup -h postgres-oltp -p 5432 -U binno \
                  -D "$$PGDATA" -Fp -Xs -P -R; do
            echo "replica: primary not ready for basebackup, retrying"
            sleep 3
          done
          chmod 0700 "$$PGDATA"
          echo "replica: clone complete"
        fi
        if ! postgres -c max_parallel_workers_per_gather=0; then
          if grep -qs "has already been removed" "$$PGDATA/log"/* 2>/dev/null ||
             [ -f "$$PGDATA/standby.signal" ]; then
            echo "replica: cannot resume from this point, discarding and re-cloning"
            rm -rf "$$PGDATA"/*
          fi
          exit 1
        fi
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql -h 127.0.0.1 -U binno -d binno -tAc
          "SELECT pg_is_in_recovery() AND EXISTS (SELECT 1 FROM pg_stat_wal_receiver WHERE status = 'streaming')"
          | grep -q t
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s

  clickhouse:
    logging: *default-logging
    image: clickhouse/clickhouse-server:24.8.4.13-alpine
    profiles: [clickhouse]
    environment:
      CLICKHOUSE_DB: analytics
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Provision the analytics_events table on first init so a fresh volume is
      # queryable without a manual DDL step. The entrypoint runs this through
      # clickhouse-client, which — unlike the HTTP interface — accepts the
      # multi-statement CREATE TABLE + ALTER TABLE the file contains.
      - ./migrations/analytics/clickhouse_analytics_events.sql:/docker-entrypoint-initdb.d/10-analytics-events.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8123/?query=SELECT%201' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    logging: *default-logging
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    logging: *default-logging
    image: prom/prometheus:v2.54.1
    profiles: [observability]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9091:9090"

  grafana:
    logging: *default-logging
    image: grafana/grafana:11.2.0
    profiles: [observability]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin

  loki:
    logging: *default-logging
    image: grafana/loki:3.1.1
    profiles: [observability]
    ports:
      - "3100:3100"

  tempo:
    logging: *default-logging
    image: grafana/tempo:2.5.0
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./deploy/monitoring/tempo.yml:/etc/tempo.yml:ro
    ports:
      - "4317:4317"

  backup:
    image: postgis/postgis:16-3.4
    profiles: [backup]
    logging: *default-logging
    environment:
      PGPASSWORD: binno
      BACKUP_RETAIN_DAYS: "14"
    volumes:
      - ./backups:/backups
    depends_on:
      postgres-oltp:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          base="/backups/binno-oltp-$$stamp.dump"
          echo "backup: dumping at $$stamp"
          if pg_dump -h postgres-oltp -U binno -d binno -Fc --no-owner > "$$base.tmp"; then
            mv "$$base.tmp" "$$base"
            sha256sum "$$base" > "$$base.sha256"
            artefacts="$$base $$base.sha256"
            if [ -n "$$BACKUP_PASSPHRASE_FILE" ]; then
              if gpg --batch --yes --quiet --symmetric --cipher-algo AES256 \
                     --passphrase-file "$$BACKUP_PASSPHRASE_FILE" --output "$$base.gpg" "$$base"; then
                rm -f "$$base" "$$base.sha256"
                sha256sum "$$base.gpg" > "$$base.gpg.sha256"
                artefacts="$$base.gpg $$base.gpg.sha256"
              else
                rm -f "$$base" "$$base.sha256" "$$base.gpg"
                echo "backup: ENCRYPTION FAILED at $$stamp, nothing kept" >&2
                sleep 3600; continue
              fi
            fi
            if [ -n "$$BACKUP_UPLOAD_CMD" ]; then
              for a in $$artefacts; do
                sh -c "$$BACKUP_UPLOAD_CMD" _ "$$a" \
                  || echo "backup: OFF-HOST UPLOAD FAILED for $$a" >&2
              done
            fi
            echo "backup: wrote $$artefacts"
          else
            rm -f "$$base.tmp"
            echo "backup: FAILED at $$stamp" >&2
          fi
          find /backups \( -name 'binno-oltp-*.dump' -o -name 'binno-oltp-*.dump.gpg' \
                        -o -name 'binno-oltp-*.sha256' \) -mtime +$${BACKUP_RETAIN_DAYS} -delete
          sleep 3600
        done

volumes:
  postgres-oltp-data:
  postgres-oltp-replica-data:
  postgres-analytics-data:
  clickhouse-data:
